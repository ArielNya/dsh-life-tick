# dsh-plugin-heartbeat bundle layer.
#
# Declared via the `dsh.bundle.patch` manifest in package.json, so
# `dsh plugin add dsh-plugin-heartbeat` (and the dsh-market install flow)
# mounts this insert automatically. User-level overrides — including the
# hot-editable `enabled` / `intervalSeconds` / `pauseAfterMissed` — live in
# <dshHome>/heartbeat.json, managed by the settings panel.
- insert:
    - id: dsh-heartbeat
      name: dsh-plugin-heartbeat
